# Increase scrollback buffer size
set-option -g history-limit 50000

# Reduce escape-time to eliminate input latency (default is 500ms)
set -sg escape-time 10

set-option -g prefix Home

# tmux messages are displayed for 5 seconds
set -g display-time 5000

# Refresh 'status-left' and 'status-right' more often
set -g status-interval 5

# Applied only on WSL, detected via /proc/version (it contains "microsoft" on
# WSL1/WSL2). Elsewhere the test fails and the block is skipped.
if-shell 'grep -qi microsoft /proc/version' {
    set -g status-interval 29

    # Count of GitLab MRs awaiting my review: ~/code/mr-review-alert/fetch-count
    # prints the count (or "!" on error). Prepended to tmux's default status-right;
    # the trailing space after #(...) keeps the count off the pane title.
    set -g status-right-length 50
    set -g status-right '#(~/code/mr-review-alert/fetch-count) #{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'
}

# Upgrade $TERM
set -g default-terminal "screen-256color"

# Recommended by Claude Code for terminal feature passthrough (images, extended keys)
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# Hotkeys
bind -T copy-mode C-x send -X rectangle-toggle
bind-key -T copy-mode C-l send -X scroll-middle

# Copy the selection to the system clipboard too: clip.exe on WSL, xclip
# elsewhere (sudo apt-get install -y xclip).
if-shell 'grep -qi microsoft /proc/version' {
    bind -T copy-mode M-w send-keys -X copy-pipe "clip.exe"
} {
    bind -T copy-mode M-w send-keys -X copy-pipe "xclip -sel clip -i"
}

# prefix + M-3 / M-4: arrange the window as three or four equally wide
# side-by-side panes, the tmux counterpart of C-c l in Emacs. Other panes in
# the window are closed first. Alt+digit after the prefix is already tmux's
# layout convention (M-1 even-horizontal, M-2 even-vertical, M-5 tiled); this
# replaces the rarely used main-horizontal (M-3) and main-vertical (M-4).
bind M-3 kill-pane -a \; split-window -h \; split-window -h \; select-layout even-horizontal
bind M-4 kill-pane -a \; split-window -h \; split-window -h \; split-window -h \; select-layout even-horizontal
